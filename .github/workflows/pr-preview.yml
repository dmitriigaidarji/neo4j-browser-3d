# Builds every pull request and publishes it to a live URL so the changes can
# be clicked through before merging:
#
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
#
# The preview is written into the `gh-pages` branch alongside production and is
# deleted automatically when the PR closes. `base: "./"` in vite.config.ts is
# what lets the same build run from that nested path.
#
# Pull requests from forks are skipped: they run with a read-only token by
# design and cannot publish. Use the `dist` artifact from the CI workflow for
# those.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      CLOSING: ${{ github.event.action == 'closed' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build

      - name: Publish preview
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add ../pages gh-pages
          else
            git worktree add --detach ../pages
            git -C ../pages checkout --orphan gh-pages
            git -C ../pages reset --hard
            touch ../pages/.nojekyll
          fi

          TARGET="../pages/pr-preview/pr-${PR_NUMBER}"
          rm -rf "$TARGET"
          if [ "$CLOSING" != "true" ]; then
            mkdir -p "$TARGET"
            cp -r dist/. "$TARGET/"
          fi

          cd ../pages
          git add -A
          if git diff --staged --quiet; then
            echo "Preview unchanged; nothing to publish."
            exit 0
          fi
          if [ "$CLOSING" = "true" ]; then
            git commit -m "preview: remove pr-${PR_NUMBER}"
          else
            git commit -m "preview: pr-${PR_NUMBER} at ${GITHUB_SHA::7}"
          fi

          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing on latest."
            git pull --rebase origin gh-pages
          done
          echo "Could not publish after 3 attempts." >&2
          exit 1

      - name: Comment with the preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${context.issue.number}/`;
            const marker = '<!-- pr-preview-url -->';
            const body = [
              marker,
              `### 🔎 Preview`,
              ``,
              `This pull request is deployed at **${url}**`,
              ``,
              `Built from ${context.sha.substring(0, 7)}. The preview updates on every push and is removed when the PR closes.`,
              ``,
              `---`,
              `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join('\n');

            // Update the existing comment instead of adding one per push.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
